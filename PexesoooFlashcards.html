<!DOCTYPE html>
<!-- Source: https://github.com/KarlM0/Pexesooo/ | SPDX-License-Identifier: CC-BY-NC-ND-4.0 -->
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- SECURITY: CSP restricts script sources to inline only (required for self-contained file),
     images to data: and blob: URIs only, fonts to Google Fonts, no other network. -->
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; connect-src 'none';">
<title>Pexesooo Flashcards</title>

<!-- DESIGN.md Part 1 — fonts from Google Fonts (per doc). Offline: system fallback accepted. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ===== DESIGN.md Part 1 — Universal foundations (verbatim) ===== */
:root {
  --bg:#141518; --surface:#1c1d22; --surface-2:#24252c; --border:#2e2f38;
  --border-soft:#26272f; --text:#e9e9ec; --text-dim:#9a9aa6; --text-faint:#62636e;
  --accent:#7cdcc4; --accent-deep:#152823; --ok:#6fd089; --bad:#e8736f;
  --track:#34353f; --radius:14px; --radius-sm:9px;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }

/* Page layout / header (Part 2). Deck mode is a single centred card, so the 760px
   settings cap is the right container here (unlike the game's wider board). */
.wrap { max-width:760px; margin:0 auto; padding:34px 20px 80px; }
.header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:30px; }
h1 { font-family:'Fraunces',serif; font-weight:600; font-size:30px; letter-spacing:-0.01em; line-height:1.1; }
.subtitle { font-size:13.5px; color:var(--text-dim); margin-top:4px; }
.version { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.03em; color:var(--text-faint); margin-top:6px; }
/* DERIVED — repo link; sits below version string, same typographic level (reused verbatim
   from the game / generator / printer). FLAG: candidate for DESIGN.md. */
.repo-link { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.03em; margin-top:4px; }
.repo-link a { color:var(--text-faint); text-decoration:none; transition:color 0.16s; }
.repo-link a:hover { color:var(--accent); }
.header-right { flex-shrink:0; }

/* Pill button group (Part 2) */
.pillgroup { display:inline-flex; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:3px; }
.pillgroup button { background:transparent; color:var(--text-dim); font-family:'Manrope'; font-weight:600;
  font-size:12px; letter-spacing:0.03em; padding:5px 11px; border-radius:999px; border:none; cursor:pointer; transition:0.18s; }
.pillgroup button.active { background:var(--accent); color:#0e1714; }

/* Cards + collapsible (Part 2) */
.card { background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:22px; margin-bottom:18px; }
.chead { display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none; margin-bottom:20px; }
.card.collapsed .chead { margin-bottom:0; }
.card.collapsed .cbody { display:none; }
.section-title { font-family:'Manrope'; font-weight:700; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-faint); }
.chev { color:var(--text-dim); transition:transform 0.2s ease; }
.card.collapsed .chev { transform:rotate(-90deg); }
.hidden { display:none !important; }

/* Field labels (Part 2) */
.field { margin-bottom:16px; }
.label { display:block; font-family:'Manrope'; font-weight:600; font-size:12.5px; color:var(--text-dim); margin-bottom:7px; }

/* Buttons (Part 2) */
.btn { width:100%; border-radius:var(--radius-sm); font-family:'Manrope'; font-weight:700; font-size:14.5px;
  padding:14px; letter-spacing:0.01em; transition:0.16s; border:none; cursor:pointer; }
.btn-primary { background:var(--accent); color:#0e1714; }
.btn-primary:hover { filter:brightness(1.08); }
.btn-ghost { background:var(--surface-2); border:1px solid var(--border); color:var(--text); }
.btn-ghost:hover { border-color:var(--accent); color:var(--accent); }
.btn:disabled { opacity:0.35; cursor:not-allowed; filter:none; }
.btn-row { display:flex; gap:12px; margin-top:4px; }

/* Toggle switches + switch rows (Part 2) */
.switch-row { display:flex; align-items:center; justify-content:space-between; gap:16px;
  border-top:1px solid var(--border-soft); padding:11px 0; }
.switch-row .sl { font-family:'Manrope'; font-weight:600; font-size:13.5px; }
.switch-row .sd { font-family:'Manrope'; font-size:11.5px; color:var(--text-faint); }
.toggle { flex-shrink:0; width:42px; height:24px; border-radius:999px; background:var(--surface-2);
  border:1px solid var(--border); position:relative; cursor:pointer; transition:0.18s; }
.toggle .knob { position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%;
  background:var(--text-faint); transition:0.18s; }
.toggle.on { background:var(--accent-deep); border-color:var(--accent); }
.toggle.on .knob { transform:translateX(18px); background:var(--accent); }

/* Progress bar (Part 2) — two filled segments: --ok = retired, --bad = waiting for a repeat. */
.track { height:9px; border-radius:999px; background:var(--track); overflow:hidden; display:flex; }
.track .fill { height:100%; transition:width 0.35s ease; }
.track .fill.ok  { background:var(--ok); }
.track .fill.bad { background:var(--bad); }

/* DERIVED — file/folder picker pair (reused verbatim from the game; FLAG: candidate for DESIGN.md). */
.picker-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.picker { display:block; border:1.5px dashed var(--border); background:var(--surface-2); border-radius:var(--radius-sm);
  padding:18px; text-align:center; cursor:pointer; transition:0.16s; }
.picker:hover, .picker.drag { border-color:var(--accent); }
.picker.loaded { border-style:solid; border-color:var(--accent); }
.picker .emoji { font-size:22px; display:block; margin-bottom:6px; }
.picker .ptitle { font-weight:600; font-size:13.5px; }
.picker .pmeta { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-faint); margin-top:5px; }
.picker input[type=file] { display:none; }

/* Set preview / set list (reused verbatim from the game and the printer). */
.preview { display:flex; gap:16px; align-items:flex-start; background:var(--surface-2); border:1px solid var(--border-soft);
  border-radius:var(--radius-sm); padding:14px; margin-top:14px; }
.preview-main { flex:1; min-width:0; }
.preview .pname { font-family:'Fraunces',serif; font-weight:600; font-size:18px; }
.preview .pdesc { font-size:13px; color:var(--text-dim); margin-top:3px; }
.preview .pcount { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-faint); margin-top:6px; }
.samples { display:flex; gap:14px; margin-top:12px; flex-wrap:wrap; }
.sample-pair { display:flex; gap:6px; align-items:center; background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:6px; }
.mini { width:42px; height:42px; border-radius:6px; object-fit:cover; background:var(--surface-2); display:block; }
.preview-back { flex-shrink:0; text-align:center; }
.preview-back img { width:120px; height:120px; border-radius:var(--radius-sm); object-fit:cover; border:1px solid var(--border); display:block; }
.preview-back .cap { font-family:'Manrope'; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); margin-top:6px; }
.set-list { margin-top:14px; display:flex; flex-direction:column; gap:8px; }
.set-list .preview { margin-top:0; cursor:pointer; border:1.5px solid var(--border); transition:border-color 0.16s, background 0.16s; }
.set-list .preview:hover { border-color:var(--accent); }
.set-list .preview.selected { border-color:var(--accent); background:var(--accent-deep); }
.set-list .preview-back img { width:60px; height:60px; }

.error-banner { background:rgba(232,115,111,0.08); border:1px solid var(--bad); color:var(--bad); border-radius:var(--radius-sm); padding:11px 13px; font-size:13px; margin-top:14px; }
/* DERIVED — loading state indicator (reused from the game; FLAG: candidate). */
.loading-msg { font-family:'Manrope'; font-weight:700; font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
  color:var(--text-faint); margin-top:14px; text-align:center; padding:18px 0; }
/* DERIVED — advisory notice (reused from the printer). The amber variant uses the warm-amber
   triplet named in DESIGN.md Part 1 as situational hex, not tokens. FLAG: candidate. */
.notice { border-radius:var(--radius-sm); padding:11px 13px; font-size:13px; margin-top:12px; display:flex; gap:9px; align-items:flex-start; }
.notice .ico { flex-shrink:0; font-size:14px; line-height:1.35; }
.notice.warn { background:#2a2118; border:1px solid #5a4427; color:#e7c690; }

/* DERIVED — direction selector. The segmented option selector from the generator's resolution
   picker, extended with a live thumbnail of the set's first pair so the player can see which
   image asks and which answers (a set file records no side semantics). Built from Part 1
   tokens: surface-2 / border / accent / accent-deep, radius-sm, JetBrains Mono for the
   A → B title, Manrope for the hint. FLAG: candidate for DESIGN.md. */
.dirgroup { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.diropt { border:1.5px solid var(--border); background:var(--surface-2); border-radius:var(--radius-sm);
  padding:12px 14px; cursor:pointer; transition:0.16s; text-align:left; font-family:inherit; }
.diropt:hover { border-color:var(--accent); }
.diropt.active { border-color:var(--accent); background:var(--accent-deep); }
.diropt .dtitle { font-family:'JetBrains Mono',monospace; font-weight:500; font-size:14px; color:var(--text); letter-spacing:0.02em; }
.diropt.active .dtitle { color:var(--accent); }
.diropt .dhint { font-family:'Manrope'; font-weight:600; font-size:11.5px; color:var(--text-dim); margin-top:4px; }
.diropt.active .dhint { color:var(--text); }
.dirthumbs { display:flex; align-items:center; gap:8px; margin-top:9px; }
.dirthumbs .arrow { font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--text-faint); }
.diropt.active .dirthumbs .arrow { color:var(--accent); }
.dirthumbs .slotph { width:42px; height:42px; border-radius:6px; background:var(--surface); border:1px dashed var(--border); }

/* DERIVED — deck stage + flashcard. The flip is the game's card component, reused verbatim
   (0.3s eased rotateY — the documented motion exception), enlarged to a single centred card
   and re-labelled for its new semantics: the resting face is the PROMPT image (not a shared
   card back) and the flipped face is the ANSWER. The answer face carries an --accent border
   so the revealed side reads as the interactive/affirmative state, consistent with every
   other active state in the system. FLAG: candidate for DESIGN.md. */
.deck-stage { display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:20px; }
.side-tag { font-family:'Manrope'; font-weight:700; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-faint); }
.side-tag.answer { color:var(--accent); }
.flashslot { width:min(340px, 78vw); aspect-ratio:1/1; perspective:900px; }
.card3d { position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform 0.3s ease; cursor:pointer; }
.card3d.up { transform:rotateY(180deg); }
.card3d:focus-visible { outline:none; }
.card3d:focus-visible .card-face { box-shadow:0 0 0 3px var(--accent-deep), 0 0 0 4px var(--accent); }
.card-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius);
  display:flex; align-items:center; justify-content:center; overflow:hidden; background:var(--surface-2); }
.face-prompt { border:1px solid var(--border); }
.face-answer { border:1.5px solid var(--accent); transform:rotateY(180deg); }
.card-face img { width:100%; height:100%; object-fit:cover; display:block; }
.flip-hint { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-faint); }

/* DERIVED — session status line above the progress bar. Mono counters at the version-string
   typographic level; layout mirrors the game's timer-top row. FLAG: candidate. */
.status-row { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; gap:12px; }
.status-label { font-family:'Manrope'; font-weight:700; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-faint); }
.status-num { font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--text-dim); }
.status-wrap { margin-bottom:20px; }

/* Results (reused from the game) */
.result-line { display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--border-soft); padding:12px 0; }
.result-line:first-child { border-top:none; }
.rname { font-family:'Manrope'; font-weight:700; font-size:15px; }
.rmeta { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-faint); margin-top:2px; }
.rscore { font-family:'Fraunces',serif; font-weight:600; font-size:34px; }
.rscore.ok { color:var(--ok); }
.rscore.bad { color:var(--bad); }
.bigtime { font-family:'Fraunces',serif; font-weight:600; font-size:34px; }
.time-row { display:flex; align-items:baseline; gap:10px; margin-bottom:16px; }
.time-row .tl { font-family:'Manrope'; font-weight:700; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-faint); }
.won-cards { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; margin-bottom:6px; }
.won-pair { display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:6px; padding:4px; }

/* Animations (Part 1) */
@keyframes rise { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:none; } }
.rise { animation:rise 0.35s ease both; }

/* Responsive breakpoint (Part 2) */
@media (max-width:560px){
  h1 { font-size:25px; }
  .picker-row, .dirgroup { grid-template-columns:1fr; }
  .preview { flex-direction:column; }
  .btn-row { flex-direction:column; }
}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <div class="header">
    <div>
      <h1 id="t-title">Pexesooo Flashcards</h1>
      <div class="subtitle" id="t-subtitle">Study a set one card at a time.</div>
      <div class="version">v1.9.0</div>
      <div class="repo-link"><a id="t-repo" href="https://github.com/KarlM0/Pexesooo/" target="_blank" rel="noopener noreferrer">View on GitHub</a></div>
    </div>
    <div class="header-right">
      <div class="pillgroup" id="lang">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="cs" class="active">CS</button>
      </div>
    </div>
  </div>

  <!-- SETTINGS -->
  <div class="card" id="settingsCard">
    <div class="chead" data-toggle="settingsCard">
      <div class="section-title" id="t-settings">Settings</div>
      <svg class="chev" viewBox="0 0 16 16" width="15" height="15"><path d="M4 6 L8 10 L12 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="cbody">

      <div class="field">
        <label class="label" id="t-setlabel">Card set</label>
        <div class="picker-row">
          <label class="picker" id="pickerFile">
            <span class="emoji">🗂️</span>
            <span class="ptitle" id="t-pick">Choose a set file (.json)</span>
            <span class="pmeta" id="pmetaFile">—</span>
            <input type="file" id="fileIn" accept="application/json,.json">
          </label>
          <label class="picker" id="pickerFolder">
            <span class="emoji">📁</span>
            <span class="ptitle" id="t-pickfolder">Choose a folder</span>
            <span class="pmeta" id="pmetaFolder">—</span>
            <input type="file" id="folderIn" webkitdirectory directory multiple>
          </label>
        </div>
        <div id="previewHost"></div>
        <div id="noticeHost"></div>
      </div>

      <div class="field">
        <label class="label" id="t-dirlabel">Which side asks</label>
        <div class="dirgroup" id="dirGroup">
          <button type="button" class="diropt active" data-dir="ab">
            <div class="dtitle">A → B</div>
            <div class="dhint" id="t-dirab">First image asks, second answers</div>
            <div class="dirthumbs" id="thumbsAB"></div>
          </button>
          <button type="button" class="diropt" data-dir="ba">
            <div class="dtitle">B → A</div>
            <div class="dhint" id="t-dirba">Second image asks, first answers</div>
            <div class="dirthumbs" id="thumbsBA"></div>
          </button>
        </div>
      </div>

      <div class="field">
        <div class="switch-row">
          <div>
            <div class="sl" id="t-shufflelabel">Shuffle the deck</div>
            <div class="sd" id="t-shufflehint">Off keeps the set's own order</div>
          </div>
          <div class="toggle on" id="shuffleToggle"><div class="knob"></div></div>
        </div>
      </div>

      <button class="btn btn-primary" id="startBtn" disabled><span id="t-start">Start studying</span></button>
    </div>
  </div>

  <!-- STUDY -->
  <div class="card collapsed" id="studyCard">
    <div class="chead" data-toggle="studyCard">
      <div class="section-title" id="t-study">Study</div>
      <svg class="chev" viewBox="0 0 16 16" width="15" height="15"><path d="M4 6 L8 10 L12 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="cbody">

      <div class="status-wrap">
        <div class="status-row">
          <div class="status-label" id="t-roundlabel">Round 1</div>
          <div class="status-num" id="statusNum">0 / 0</div>
        </div>
        <div class="track">
          <div class="fill ok" id="fillOk" style="width:0%"></div>
          <div class="fill bad" id="fillBad" style="width:0%"></div>
        </div>
      </div>

      <div class="deck-stage">
        <div class="side-tag" id="sideTag">Prompt</div>
        <div class="flashslot"><div class="card3d" id="flashCard" role="button" tabindex="0"></div></div>
        <div class="flip-hint" id="flipHint">Space</div>
      </div>

      <div id="actionsHost"></div>

      <button class="btn btn-ghost" id="endBtn" style="margin-top:12px"><span id="t-end">End session</span></button>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="card collapsed" id="resultCard">
    <div class="chead" data-toggle="resultCard">
      <div class="section-title" id="t-results">Results</div>
      <svg class="chev" viewBox="0 0 16 16" width="15" height="15"><path d="M4 6 L8 10 L12 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="cbody">
      <div class="time-row"><span class="tl" id="t-time">Time</span><span class="bigtime" id="resTime">0:00</span></div>
      <div id="resultLines"></div>
      <div class="btn-row" style="margin-top:18px">
        <button class="btn btn-ghost" id="againMissedBtn"><span id="t-againmissed">Study the ones I missed</span></button>
        <button class="btn btn-primary" id="againAllBtn"><span id="t-againall">Study again</span></button>
      </div>
      <button class="btn btn-ghost" id="differentBtn" style="margin-top:12px"><span id="t-different">Different set</span></button>
    </div>
  </div>

</div>

<script>
"use strict";

/* ============================================================================
   Pexesooo Flashcards — deck-mode study app.

   A pexeso pair {a, b} is read as one flashcard: one side asks, the other
   answers. The set file records no side semantics (the generator's folder A /
   folder B choice is the only ordering), so direction is chosen here at read
   time. No schema change: this app reads the same version-1 set files as the
   game and the printer.
   ============================================================================ */

/* ---------------- i18n ---------------- */
const STR = {
  en: { title:"Pexesooo Flashcards", subtitle:"Study a set one card at a time.",
    settings:"Settings", setlabel:"Card set",
    pick:"Choose a set file (.json)", pickFolder:"Choose a folder",
    noFile:"—", noFolder:"—", back:"Card back", pairs:"pairs",
    badFile:"That file isn't a valid Pexesooo set.",
    badFolder:"No valid Pexesooo sets found in that folder.",
    loadingFolder:"Reading folder…",
    identical:"Both sides of every pair look identical, so each card answers itself. Build a set from two different folders to study with it.",
    dirlabel:"Which side asks", dirAB:"First image asks, second answers", dirBA:"Second image asks, first answers",
    shuffleLabel:"Shuffle the deck", shuffleHint:"Off keeps the set's own order",
    start:"Start studying",
    study:"Study", round:"Round {n}", cardsLeft:"{done} / {total}",
    prompt:"Prompt", answer:"Answer",
    flipHint:"Tap the card or press Space",
    judgeHint:"← repeat · knew it →",
    reveal:"Show answer", knew:"Knew it", repeat:"Repeat",
    end:"End session",
    results:"Results", time:"Time",
    firstTry:"Right first time", needed:"Needed a repeat", unseen:"Not studied",
    repeatsTotal:"repeats: {n}", cards:"cards",
    againMissed:"Study the ones I missed", againAll:"Study again", different:"Different set",
    repo:"View on GitHub" },
  cs: { title:"Pexesooo Kartičky", subtitle:"Učte se ze sady kartu po kartě.",
    settings:"Nastavení", setlabel:"Sada karet",
    pick:"Vyberte soubor sady (.json)", pickFolder:"Vyberte složku",
    noFile:"—", noFolder:"—", back:"Rub karet", pairs:"dvojic",
    badFile:"Tento soubor není platná sada Pexesooo.",
    badFolder:"Ve vybrané složce nejsou žádné platné sady Pexesooo.",
    loadingFolder:"Čtení složky…",
    identical:"Obě strany každé dvojice vypadají stejně, takže si každá karta odpovídá sama. Pro učení vytvořte sadu ze dvou různých složek.",
    dirlabel:"Která strana se ptá", dirAB:"Ptá se první obrázek, odpovídá druhý", dirBA:"Ptá se druhý obrázek, odpovídá první",
    shuffleLabel:"Zamíchat balíček", shuffleHint:"Vypnuto zachová pořadí sady",
    start:"Začít se učit",
    study:"Učení", round:"Kolo {n}", cardsLeft:"{done} / {total}",
    prompt:"Otázka", answer:"Odpověď",
    flipHint:"Klepněte na kartu nebo stiskněte mezerník",
    judgeHint:"← opakovat · umím →",
    reveal:"Ukázat odpověď", knew:"Umím", repeat:"Opakovat",
    end:"Ukončit učení",
    results:"Výsledky", time:"Čas",
    firstTry:"Hned napoprvé", needed:"Potřebovalo opakování", unseen:"Neprobráno",
    repeatsTotal:"opakování: {n}", cards:"karet",
    againMissed:"Projít ty, co mi nešly", againAll:"Učit se znovu", different:"Jiná sada",
    repo:"Zobrazit na GitHubu" }
};
let lang = "cs";
const L = () => STR[lang];
function txt(id,key){ const e=document.getElementById(id); if(e) e.textContent=L()[key]; }
function fill(tpl,vals){ return tpl.replace(/\{(\w+)\}/g, (m,k)=> (k in vals ? vals[k] : m)); }

function applyLang(){
  txt("t-title","title"); txt("t-subtitle","subtitle"); txt("t-settings","settings");
  txt("t-setlabel","setlabel"); txt("t-pick","pick"); txt("t-pickfolder","pickFolder");
  txt("t-dirlabel","dirlabel"); txt("t-dirab","dirAB"); txt("t-dirba","dirBA");
  txt("t-shufflelabel","shuffleLabel"); txt("t-shufflehint","shuffleHint");
  txt("t-start","start"); txt("t-study","study"); txt("t-end","end");
  txt("t-results","results"); txt("t-time","time");
  txt("t-againmissed","againMissed"); txt("t-againall","againAll"); txt("t-different","different");
  txt("t-repo","repo");
  document.title = L().title;

  const other = STR[lang==="en"?"cs":"en"];
  const pf = document.getElementById("pmetaFile");
  if (!setData && pf.textContent === other.noFile) pf.textContent = L().noFile;
  const pfo = document.getElementById("pmetaFolder");
  if (pfo.textContent === other.noFolder) pfo.textContent = L().noFolder;

  if (folderSets.length) renderFolderList();
  else if (setData && !isFolderMode) renderPreview(setData);
  renderNotice();
  renderDirThumbs();
  if (session) { renderCard(); renderStatus(); }
  if (lastSummary) renderResults(lastSummary);
}
function setLang(code){
  if (code !== "en" && code !== "cs") return;
  lang = code;
  document.querySelectorAll("#lang button").forEach(x=>x.classList.toggle("active", x.dataset.lang===code));
  applyLang();
}
document.getElementById("lang").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  setLang(b.dataset.lang);
});

/* ---------------- collapsible ---------------- */
document.querySelectorAll(".chead").forEach(h=>{
  h.addEventListener("click", ()=> document.getElementById(h.dataset.toggle).classList.toggle("collapsed"));
});
function setCollapsed(id,v){ document.getElementById(id).classList.toggle("collapsed", v); }

/* ============================================================================
   SHARED SET-LOADING BLOCK — kept byte-identical with PexesoooGame.html and
   PexesoooPrinter.html. The single-file / no-build constraint rules out a
   shared module (ES imports are blocked from file://, and an external
   <script src> would break self-containment), so this duplication is
   deliberate. Keep edits mechanical and mirrored across all apps.
   ============================================================================ */

/* SECURITY: cap pair count and per-image src size to prevent memory DoS. */
const MAX_PAIRS = 500;
const MAX_SRC_BYTES = 3 * 1024 * 1024; // 3 MB per image src (base64 ~4/3 of raw)

let setData = null;
let folderSets = [];
let isFolderMode = false;

/* SECURITY: sideValidImage enforces data:image prefix and per-src size cap. */
function sideValidImage(s){
  if (!s || s.kind !== "image") return false;
  if (typeof s.src !== "string") return false;
  if (!s.src.startsWith("data:image")) return false;
  if (s.src.length > MAX_SRC_BYTES) return false;
  return true;
}
function validSet(d){
  if (!d || d.format !== "pexesooo" || !Array.isArray(d.pairs) || d.pairs.length < 2) return false;
  if (d.pairs.length > MAX_PAIRS) return false;
  return d.pairs.every(p => p && p.a && p.b && sideValidImage(p.a) && sideValidImage(p.b));
}
function fmtCreatedAt(iso){
  if (!iso) return "";
  try {
    const d = new Date(iso);
    const yyyy=d.getUTCFullYear(), mm=String(d.getUTCMonth()+1).padStart(2,"0"),
      dd=String(d.getUTCDate()).padStart(2,"0"), HH=String(d.getUTCHours()).padStart(2,"0"),
      MM=String(d.getUTCMinutes()).padStart(2,"0");
    return `${yyyy}-${mm}-${dd} ${HH}:${MM}`;
  } catch(e){ return ""; }
}
function fmtSetMeta(d){
  const parts = [ (d.pairCount || d.pairs.length) + " " + L().pairs ];
  const dateStr = fmtCreatedAt(d.createdAt);
  if (dateStr) parts.push(dateStr);
  if (d.thumb && d.thumb.size) parts.push(d.thumb.size + " px");
  return parts.join(", ");
}
/* SECURITY: safe image element factory — assigns src via DOM property, never innerHTML. */
function makeSafeImg(src, cls, alt){
  const img = document.createElement("img");
  if (cls) img.className = cls;
  if (alt !== undefined) img.alt = alt;
  img.src = src;
  return img;
}
function resetPickers(){
  document.getElementById("pickerFile").classList.remove("loaded");
  document.getElementById("pickerFolder").classList.remove("loaded");
  document.getElementById("pmetaFile").textContent = L().noFile;
  document.getElementById("pmetaFolder").textContent = L().noFolder;
}
function clearSet(){
  setData = null; folderSets = []; isFolderMode = false;
  document.getElementById("previewHost").innerHTML = "";
  document.getElementById("noticeHost").innerHTML = "";
}

/* ---------------- file picker (single JSON) ---------------- */
document.getElementById("fileIn").addEventListener("change", async (ev)=>{
  const f = ev.target.files[0]; if(!f) return;
  clearSet(); resetPickers(); isFolderMode = false;
  try {
    const data = JSON.parse(await f.text());
    if (!validSet(data)) throw new Error("invalid");
    if (data.back && !sideValidImage(data.back)) delete data.back;
    setData = data;
    document.getElementById("pmetaFile").textContent = f.name;
    document.getElementById("pickerFile").classList.add("loaded");
    renderPreview(setData);
    onSetSelected();
  } catch(e){
    document.getElementById("previewHost").innerHTML = `<div class="error-banner">${L().badFile}</div>`;
    onSetSelected();
  }
});

/* ---------------- folder picker ---------------- */
document.getElementById("folderIn").addEventListener("change", async (ev)=>{
  const files = ev.target.files; if(!files || !files.length) return;
  clearSet(); resetPickers(); isFolderMode = true;

  const firstPath = files[0].webkitRelativePath || files[0].name;
  const folderName = firstPath.includes("/") ? firstPath.split("/")[0] : "folder";
  document.getElementById("pmetaFolder").textContent = folderName;
  document.getElementById("pickerFolder").classList.add("loaded");
  document.getElementById("previewHost").innerHTML = `<div class="loading-msg">${L().loadingFolder}</div>`;

  const jsonFiles = Array.from(files).filter(f => {
    const rel = f.webkitRelativePath || f.name;
    const parts = rel.split("/");
    return parts.length === 2 && parts[1].toLowerCase().endsWith(".json");
  });

  const valid = [];
  for (const f of jsonFiles){
    try {
      const data = JSON.parse(await f.text());
      if (!validSet(data)) continue;
      if (data.back && !sideValidImage(data.back)) delete data.back;
      valid.push(data);
    } catch(e){ /* silently skip */ }
  }

  if (valid.length === 0){
    document.getElementById("previewHost").innerHTML = `<div class="error-banner">${L().badFolder}</div>`;
    onSetSelected(); return;
  }

  valid.sort((a,b) => (a.name||"").localeCompare(b.name||""));
  folderSets = valid;
  renderFolderList();
  onSetSelected();
});

/* ---------------- set preview ---------------- */
/* SECURITY: builds all user-data-derived content via createElement + textContent + makeSafeImg. */
function buildPreviewEl(d){
  const wrap = document.createElement("div");
  wrap.className = "preview rise";
  const main = document.createElement("div");
  main.className = "preview-main";

  const nameEl = document.createElement("div");
  nameEl.className = "pname"; nameEl.textContent = d.name || "Untitled set";
  main.appendChild(nameEl);
  if (d.description){
    const descEl = document.createElement("div");
    descEl.className = "pdesc"; descEl.textContent = d.description;
    main.appendChild(descEl);
  }
  const metaEl = document.createElement("div");
  metaEl.className = "pcount"; metaEl.textContent = fmtSetMeta(d);
  main.appendChild(metaEl);

  const samplesDiv = document.createElement("div");
  samplesDiv.className = "samples";
  d.pairs.slice(0, 2).forEach(p => {
    const pair = document.createElement("div");
    pair.className = "sample-pair";
    pair.appendChild(makeSafeImg(p.a.src, "mini", ""));
    pair.appendChild(makeSafeImg(p.b.src, "mini", ""));
    samplesDiv.appendChild(pair);
  });
  main.appendChild(samplesDiv);
  wrap.appendChild(main);

  if (d.back && d.back.kind === "image"){
    const backDiv = document.createElement("div");
    backDiv.className = "preview-back";
    backDiv.appendChild(makeSafeImg(d.back.src, null, ""));
    const cap = document.createElement("div");
    cap.className = "cap"; cap.textContent = L().back;
    backDiv.appendChild(cap);
    wrap.appendChild(backDiv);
  }
  return wrap;
}
function renderFolderList(){
  const host = document.getElementById("previewHost");
  host.innerHTML = "";
  const list = document.createElement("div");
  list.className = "set-list";
  folderSets.forEach((d, idx) => {
    const el = buildPreviewEl(d);
    el.style.animationDelay = (idx * 32) + "ms";
    if (d === setData) el.classList.add("selected");
    el.addEventListener("click", () => {
      setData = d;
      list.querySelectorAll(".preview").forEach(r => r.classList.remove("selected"));
      el.classList.add("selected");
      onSetSelected();
    });
    list.appendChild(el);
  });
  host.appendChild(list);
}
function renderPreview(d){
  const host = document.getElementById("previewHost");
  host.innerHTML = "";
  host.appendChild(buildPreviewEl(d));
}
/* ======================= END SHARED SET-LOADING BLOCK ======================= */

/* ---------------- settings state ---------------- */
let direction = "ab";           // "ab" = a asks, b answers; "ba" = the reverse
let shuffleOn = true;

document.getElementById("dirGroup").addEventListener("click", e=>{
  const b = e.target.closest(".diropt"); if(!b) return;
  direction = b.dataset.dir;
  document.querySelectorAll("#dirGroup .diropt").forEach(x=>x.classList.toggle("active", x.dataset.dir===direction));
});
const shuffleToggle = document.getElementById("shuffleToggle");
shuffleToggle.addEventListener("click", ()=>{
  shuffleOn = !shuffleOn;
  shuffleToggle.classList.toggle("on", shuffleOn);
});

/* Direction thumbnails — show the set's first pair inside each option so the player
   can see which image asks. A set file carries no side labels, so this is the only
   way to make the A/B choice concrete. */
function renderDirThumbs(){
  const hostAB = document.getElementById("thumbsAB");
  const hostBA = document.getElementById("thumbsBA");
  [hostAB, hostBA].forEach(h => h.innerHTML = "");
  const mk = (host, first, second) => {
    if (!setData){
      const p1 = document.createElement("div"); p1.className = "slotph";
      const ar = document.createElement("div"); ar.className = "arrow"; ar.textContent = "→";
      const p2 = document.createElement("div"); p2.className = "slotph";
      host.append(p1, ar, p2); return;
    }
    const p = setData.pairs[0];
    host.appendChild(makeSafeImg(first === "a" ? p.a.src : p.b.src, "mini", ""));
    const ar = document.createElement("div"); ar.className = "arrow"; ar.textContent = "→";
    host.appendChild(ar);
    host.appendChild(makeSafeImg(second === "a" ? p.a.src : p.b.src, "mini", ""));
  };
  mk(hostAB, "a", "b");
  mk(hostBA, "b", "a");
}

/* Advisory: a set built by pointing both generator folders at the same folder produces
   1:1 identical pairs — valid pexeso, but each flashcard would answer itself. Heuristic,
   sampled over the first few pairs so a 500-pair set is not compared byte-for-byte. */
function looksIdentical(d){
  if (!d) return false;
  const n = Math.min(8, d.pairs.length);
  for (let i=0;i<n;i++){
    const p = d.pairs[i];
    if (p.a.src.length !== p.b.src.length || p.a.src !== p.b.src) return false;
  }
  return true;
}
function renderNotice(){
  const host = document.getElementById("noticeHost");
  host.innerHTML = "";
  if (!looksIdentical(setData)) return;
  const n = document.createElement("div");
  n.className = "notice warn";
  const ico = document.createElement("span"); ico.className = "ico"; ico.textContent = "⚠️";
  const t = document.createElement("div"); t.textContent = L().identical;
  n.append(ico, t);
  host.appendChild(n);
}

function onSetSelected(){
  renderDirThumbs();
  renderNotice();
  document.getElementById("startBtn").disabled = !setData;
}
renderDirThumbs();

/* ---------------- session ---------------- */
/* A session is a queue of cards plus a leftover pile. "Knew it" retires a card for good;
   "Repeat" drops it into the next round. When the queue empties, the leftover pile becomes
   the next round. The session ends when both are empty (or the player ends it early). */
let session = null;
let lastSummary = null;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmtTime(ms){
  const s = Math.floor(ms/1000);
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}

/* idxMap[i] is the position of pairs[i] in setData.pairs. Carried through the session so
   "study the ones I missed" can be applied repeatedly to ever-smaller subsets without the
   indices drifting away from the original set. */
function buildDeck(pairs, idxMap){
  return pairs.map((p, i) => ({
    idx: idxMap ? idxMap[i] : i,
    id: p.id || "",
    prompt: direction === "ab" ? p.a : p.b,
    answer: direction === "ab" ? p.b : p.a,
    repeats: 0
  }));
}

function startSession(pairs, idxMap){
  const deck = buildDeck(pairs, idxMap);
  const queue = shuffleOn ? shuffle(deck.slice()) : deck.slice();
  session = {
    total: deck.length,
    queue,
    pile: [],          // cards awaiting the next round
    known: [],         // retired cards
    round: 1,
    revealed: false,
    startTime: Date.now()
  };
  lastSummary = null;
  setCollapsed("settingsCard", true);
  setCollapsed("resultCard", true);
  setCollapsed("studyCard", false);
  renderCard(); renderStatus();
  document.getElementById("studyCard").scrollIntoView({behavior:"smooth"});
}

document.getElementById("startBtn").addEventListener("click", ()=>{
  if (setData) startSession(setData.pairs);
});

function current(){ return session && session.queue.length ? session.queue[0] : null; }

/* SECURITY: card faces are built via createElement + makeSafeImg — no set-derived
   image src is ever interpolated into innerHTML. */
function renderCard(){
  const c = current();
  const host = document.getElementById("flashCard");
  host.innerHTML = "";
  host.classList.toggle("up", !!(session && session.revealed));
  if (!c) return;

  const promptFace = document.createElement("div");
  promptFace.className = "card-face face-prompt";
  promptFace.appendChild(makeSafeImg(c.prompt.src, null, ""));
  host.appendChild(promptFace);

  const answerFace = document.createElement("div");
  answerFace.className = "card-face face-answer";
  answerFace.appendChild(makeSafeImg(c.answer.src, null, ""));
  host.appendChild(answerFace);

  const revealed = session.revealed;
  document.getElementById("sideTag").textContent = revealed ? L().answer : L().prompt;
  document.getElementById("sideTag").classList.toggle("answer", revealed);
  document.getElementById("flipHint").textContent = revealed ? L().judgeHint : L().flipHint;
  host.setAttribute("aria-label", revealed ? L().answer : L().prompt);

  renderActions();
}

function renderActions(){
  const host = document.getElementById("actionsHost");
  host.innerHTML = "";
  if (!session || !current()) return;

  if (!session.revealed){
    const b = document.createElement("button");
    b.className = "btn btn-primary";
    b.textContent = L().reveal;
    b.addEventListener("click", reveal);
    host.appendChild(b);
  } else {
    const row = document.createElement("div");
    row.className = "btn-row";
    const rep = document.createElement("button");
    rep.className = "btn btn-ghost";
    rep.textContent = "↻ " + L().repeat;
    rep.addEventListener("click", ()=>judge(false));
    const kn = document.createElement("button");
    kn.className = "btn btn-primary";
    kn.textContent = "✓ " + L().knew;
    kn.addEventListener("click", ()=>judge(true));
    row.append(rep, kn);
    host.appendChild(row);
  }
}

function renderStatus(){
  if (!session) return;
  document.getElementById("t-roundlabel").textContent = fill(L().round, {n: session.round});
  const done = session.known.length;
  document.getElementById("statusNum").textContent = fill(L().cardsLeft, {done, total: session.total});
  document.getElementById("fillOk").style.width  = (done / session.total * 100) + "%";
  document.getElementById("fillBad").style.width = (session.pile.length / session.total * 100) + "%";
}

function reveal(){
  if (!session || session.revealed || !current()) return;
  session.revealed = true;
  document.getElementById("flashCard").classList.add("up");
  const c = current();
  document.getElementById("sideTag").textContent = L().answer;
  document.getElementById("sideTag").classList.add("answer");
  document.getElementById("flipHint").textContent = L().judgeHint;
  document.getElementById("flashCard").setAttribute("aria-label", L().answer);
  renderActions();
}

function judge(knew){
  if (!session || !session.revealed) return;
  const c = session.queue.shift();
  if (knew) session.known.push(c);
  else { c.repeats++; session.pile.push(c); }

  if (!session.queue.length){
    if (session.pile.length){
      session.round++;
      session.queue = shuffleOn ? shuffle(session.pile) : session.pile;
      session.pile = [];
    } else { finishSession(); return; }
  }
  session.revealed = false;
  /* Flip back before swapping the images, so the next prompt is never briefly visible
     mid-rotation. 300ms matches the flip transition. The action buttons and the side tag
     swap immediately so the controls never lag behind the judgement. */
  document.getElementById("flashCard").classList.remove("up");
  document.getElementById("sideTag").textContent = L().prompt;
  document.getElementById("sideTag").classList.remove("answer");
  document.getElementById("flipHint").textContent = L().flipHint;
  renderActions();
  renderStatus();
  setTimeout(()=>{ if (session && !session.revealed){ renderCard(); } }, 300);
}

document.getElementById("flashCard").addEventListener("click", ()=>{
  if (!session) return;
  if (!session.revealed) reveal();
});
document.getElementById("flashCard").addEventListener("keydown", e=>{
  if (e.key === "Enter" || e.key === " "){ e.preventDefault(); if (session && !session.revealed) reveal(); }
});
document.addEventListener("keydown", e=>{
  if (!session) return;
  if (document.getElementById("studyCard").classList.contains("collapsed")) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  if (e.key === " " || e.key === "Enter"){ e.preventDefault(); if (!session.revealed) reveal(); }
  else if (session.revealed && (e.key === "ArrowRight" || e.key === "1")){ e.preventDefault(); judge(true); }
  else if (session.revealed && (e.key === "ArrowLeft"  || e.key === "2")){ e.preventDefault(); judge(false); }
});

document.getElementById("endBtn").addEventListener("click", ()=>{ if (session) finishSession(); });

/* ---------------- results ---------------- */
function finishSession(){
  const s = session;
  const unseen = s.queue.length + s.pile.length;
  const missed = s.known.filter(c => c.repeats > 0);
  lastSummary = {
    elapsed: Date.now() - s.startTime,
    total: s.total,
    firstTry: s.known.filter(c => c.repeats === 0).length,
    missed,
    repeatsTotal: s.known.reduce((n,c)=>n+c.repeats, 0) + s.queue.concat(s.pile).reduce((n,c)=>n+c.repeats, 0),
    unseen
  };
  session = null;
  renderResults(lastSummary);
  setCollapsed("studyCard", true);
  setCollapsed("resultCard", false);
  document.getElementById("resultCard").scrollIntoView({behavior:"smooth"});
}

/* SECURITY: result thumbnails use makeSafeImg; all text via textContent. */
function renderResults(sum){
  document.getElementById("resTime").textContent = fmtTime(sum.elapsed);
  const host = document.getElementById("resultLines");
  host.innerHTML = "";

  const line = (label, meta, value, cls, thumbs) => {
    const el = document.createElement("div");
    el.className = "result-line rise";
    const left = document.createElement("div");
    left.style.flex = "1";
    const n = document.createElement("div"); n.className = "rname"; n.textContent = label;
    left.appendChild(n);
    if (meta){ const m = document.createElement("div"); m.className = "rmeta"; m.textContent = meta; left.appendChild(m); }
    if (thumbs && thumbs.length){
      const strip = document.createElement("div");
      strip.className = "won-cards";
      thumbs.forEach(c => {
        const pair = document.createElement("div");
        pair.className = "won-pair";
        pair.appendChild(makeSafeImg(c.prompt.src, "mini", ""));
        pair.appendChild(makeSafeImg(c.answer.src, "mini", ""));
        if (c.id) pair.title = c.id;
        strip.appendChild(pair);
      });
      left.appendChild(strip);
    }
    el.appendChild(left);
    const v = document.createElement("div");
    v.className = "rscore" + (cls ? " " + cls : "");
    v.textContent = value;
    el.appendChild(v);
    host.appendChild(el);
    return el;
  };

  line(L().firstTry, sum.total + " " + L().cards, sum.firstTry, "ok", null);
  line(L().needed, fill(L().repeatsTotal, {n: sum.repeatsTotal}), sum.missed.length,
       sum.missed.length ? "bad" : null, sum.missed.length ? sum.missed : null);
  if (sum.unseen) line(L().unseen, "", sum.unseen, null, null);

  Array.from(host.children).forEach((el,i)=> el.style.animationDelay = (i*40)+"ms");
  document.getElementById("againMissedBtn").classList.toggle("hidden", sum.missed.length === 0);
}

document.getElementById("againAllBtn").addEventListener("click", ()=>{
  if (setData) startSession(setData.pairs);
});
document.getElementById("againMissedBtn").addEventListener("click", ()=>{
  if (!lastSummary || !lastSummary.missed.length || !setData) return;
  const idxs = new Set(lastSummary.missed.map(c=>c.idx));
  const subset = [], idxMap = [];
  setData.pairs.forEach((p,i)=>{ if (idxs.has(i)){ subset.push(p); idxMap.push(i); } });
  /* A one-card deck is a valid study session even though validSet requires 2+ pairs
     in a set file — the constraint is on the file, not on a subset of it. */
  if (subset.length) startSession(subset, idxMap);
});
document.getElementById("differentBtn").addEventListener("click", ()=>{
  session = null; lastSummary = null;
  setCollapsed("resultCard", true);
  setCollapsed("studyCard", true);
  setCollapsed("settingsCard", false);
  document.getElementById("settingsCard").scrollIntoView({behavior:"smooth"});
});

/* ---------------- launch parameters ---------------- */
/* Optional URL parameters, read from window.location.search (populated on file:// URLs too).
   Keys and values are case-insensitive; documented lowercase. Unknown keys and unrecognised
   values are ignored, leaving the normal UI defaults in place.
     lang=en|cs        initial UI language (invalid/absent → Czech default)
     dir=ab|ba         which side asks (default ab)
     shuffle=on|off    shuffle the deck (default on) */
(function applyLaunchParams(){
  let params;
  try { params = new URLSearchParams(window.location.search || ""); }
  catch(e){ return; }

  const get = key => {
    for (const [k,v] of params.entries()) if (k.toLowerCase() === key) return (v||"").toLowerCase();
    return null;
  };

  const lv = get("lang");
  if (lv === "en" || lv === "cs") setLang(lv); else applyLang();

  const dv = get("dir");
  if (dv === "ab" || dv === "ba"){
    direction = dv;
    document.querySelectorAll("#dirGroup .diropt").forEach(x=>x.classList.toggle("active", x.dataset.dir===direction));
  }

  const sv = get("shuffle");
  if (sv === "on" || sv === "off"){
    shuffleOn = (sv === "on");
    shuffleToggle.classList.toggle("on", shuffleOn);
  }
})();
</script>
